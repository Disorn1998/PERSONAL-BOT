# Phase 5 — weekly canary: GET /models only (never chat/completions)
name: canary

on:
  schedule:
    - cron: "0 6 * * 1" # weekly Monday 06:00 UTC
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  models-canary:
    name: GET /models vs .env.example
    runs-on: ubuntu-latest
    # Skip forks; maintainer must provide GROQ_API_KEY secret.
    if: github.event.repository.fork == false
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv python install 3.12
      - run: uv sync --extra dev
      - name: Run canary
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_BASE_URL: ${{ vars.GROQ_BASE_URL }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          CANARY_OPEN_ISSUES: "1"
        run: uv run python scripts/canary_models.py
