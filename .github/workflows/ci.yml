# Phase 5 — OS × Python matrix, quality gates, Docker e2e (fake Groq)
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.os }} · py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: "3.11"
          - os: ubuntu-latest
            python-version: "3.12"
          - os: ubuntu-latest
            python-version: "3.13"
          - os: windows-latest
            python-version: "3.12"
          - os: macos-latest
            python-version: "3.12"
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install project (dev)
        run: uv sync --extra dev

      - name: Ruff check
        run: uv run ruff check .

      - name: Ruff format (check)
        run: uv run ruff format --check .

      - name: Mypy
        run: uv run mypy

      - name: Pytest + coverage (soft — fail_under=0 until owner locks)
        run: >
          uv run pytest -m "not slow"
          --cov=app --cov-report=term-missing
          --cov-fail-under=0

  docker-e2e:
    name: docker e2e (fake Groq)
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Write CI env
        run: |
          cp .env.example .env.ci
          {
            echo "GROQ_API_KEY=fake-ci-key"
            echo "GROQ_BASE_URL=http://fake-groq:8080/v1"
            echo "GROQ_MODEL_PRIMARY=openai/gpt-oss-120b"
            echo "GROQ_MODEL_FALLBACK=openai/gpt-oss-20b"
          } >> .env.ci
          # Base compose references `.env`; keep a copy for merge compatibility.
          cp .env.ci .env

      - name: Start fake Groq + app via compose
        run: |
          docker compose -f docker-compose.yml -f docker-compose.ci.yml up -d --build
          for i in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:8501/_stcore/health; then
              echo "healthy"
              exit 0
            fi
            sleep 3
          done
          docker compose -f docker-compose.yml -f docker-compose.ci.yml logs
          exit 1

      - name: Tear down
        if: always()
        run: docker compose -f docker-compose.yml -f docker-compose.ci.yml down -v
