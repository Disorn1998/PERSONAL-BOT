# Phase 5 — gitleaks, pip-audit, CodeQL (public free)
name: security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 5 * * 1" # weekly Monday 05:17 UTC
  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  actions: read

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # Official binary via Docker — works on personal repos without GITLEAKS_LICENSE.
      - name: Run gitleaks
        run: >
          docker run --rm -v "$PWD:/repo"
          zricethezav/gitleaks:v8.21.2
          detect --source=/repo --config=/repo/.gitleaks.toml --verbose --redact

  pip-audit:
    name: pip-audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv python install 3.12
      - run: uv sync --extra dev
      - name: Audit locked dependencies
        run: |
          uv export --frozen --no-dev --no-emit-project -o requirements-ci.txt
          uvx pip-audit -r requirements-ci.txt

  codeql:
    name: CodeQL
    runs-on: ubuntu-latest
    # Free for public repositories; skip quietly on private forks without Advanced Security.
    if: github.event.repository.private == false
    permissions:
      security-events: write
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: python
      - uses: github/codeql-action/autobuild@v3
      - uses: github/codeql-action/analyze@v3
        with:
          category: "/language:python"
