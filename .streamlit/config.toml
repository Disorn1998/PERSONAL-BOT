# persona-bot Streamlit config
# Theme tokens aligned with persona_bot/ui/tokens.py (electric blue soft-3D).

[browser]
gatherUsageStats = false

[server]
# Local-only bind for non-Docker runs (CLI also passes --server.address=127.0.0.1).
address = "127.0.0.1"

[client]
toolbarMode = "minimal"

[theme]
base = "light"
primaryColor = "#2563EB"
backgroundColor = "#F7FAFF"
secondaryBackgroundColor = "#FFFFFF"
textColor = "#0F172A"
font = "sans-serif"
