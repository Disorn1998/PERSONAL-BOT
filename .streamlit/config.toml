# persona-bot Streamlit config
# Theme tokens aligned with persona_bot/ui/tokens.py (§17.2: warm cream + #6A5ACD).

[browser]
gatherUsageStats = false

[server]
# Local-only bind for non-Docker runs (CLI also passes --server.address=127.0.0.1).
address = "127.0.0.1"

[client]
toolbarMode = "minimal"

[theme]
base = "light"
primaryColor = "#6A5ACD"
backgroundColor = "#F4F1EA"
secondaryBackgroundColor = "#EBE6DC"
textColor = "#1A1D21"
font = "sans-serif"
