[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "persona-bot"
version = "0.2.0"
description = "Free BYOK personal AI chatbot with Persona Packs (Groq + local embeddings)"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11,<3.14"
authors = [{ name = "Disorn Suppatum" }]
keywords = ["chatbot", "rag", "streamlit", "groq", "persona"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]
dependencies = [
  "openai>=1.40",
  "streamlit>=1.40",
  "fastembed>=0.4",
  "chromadb>=0.5",
  "pythainlp>=5.0",
  "pypdf>=4.0",
  "python-docx>=1.1",
  "pydantic>=2.0",
  "pydantic-settings>=2.0",
  "pyyaml>=6.0",
  "keyring>=25.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "hypothesis>=6.100",
  "ruff>=0.6",
  "mypy>=1.11",
  "pre-commit>=3.8",
  "types-PyYAML>=6.0",
]

[project.scripts]
persona-bot = "persona_bot.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["persona_bot"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["persona_bot", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
# Strict mode applied later to core modules only (Phase 1+).
strict = false
files = ["persona_bot"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]
markers = [
  "slow: slower integration/eval tests (deselect with '-m \"not slow\"')",
]

[tool.coverage.run]
source = ["persona_bot"]
branch = true

[tool.coverage.report]
# Locked 2026-11-18: overall ≥60% hard-fail. Core ≥80% target when split coverage exists.
fail_under = 60
show_missing = true
